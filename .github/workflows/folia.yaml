name: Build Folia image

on:
  push:
    paths:
      - "images/folia"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "50 5 * * 0" # 5:50 UTC Weekly on Sundays
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yaml
    secrets: inherit
    with:
      image-name: folia
      image-desc: Minimal alpine-based folia minecraft server
      publish: ${{ github.event_name != 'pull_request' }}
      build-args: FOLIA_VERSION=26.2.x
      default-tag: "26.2"
      platforms: amd64
